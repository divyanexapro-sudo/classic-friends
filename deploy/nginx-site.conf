# Marketing website on the main domain (e.g. yourdomain.com) served as static files
server {
    listen 80;
    server_name SITE_DOMAIN www.SITE_DOMAIN;
    root APP_DIR/website;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(css|js|svg|woff2|png|jpg)$ { expires 7d; add_header Cache-Control "public"; }
}
